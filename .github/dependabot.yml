version: 2
updates:
  # npm (pnpm)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '10:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    ignore:
      # svelte-check が TypeScript の JS API (6 系まで) を使うため、typescript は 6 系に固定する。
      # TypeScript 7 は @typescript/native (npm:typescript@7) として別途導入している。
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      major:
        patterns:
          - '*'
        update-types:
          - 'major'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '10:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      github-actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      github-actions-major:
        patterns:
          - '*'
        update-types:
          - 'major'

  # Dev Containers
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '10:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      devcontainers-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      devcontainers-major:
        patterns:
          - '*'
        update-types:
          - 'major'
